<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EEON - AI Enhance</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px;
    height: 2796px;
    background: #1C1C1E;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .headline {
    margin-top: 120px;
    text-align: center;
  }
  .headline h1 {
    font-size: 104px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.05;
    letter-spacing: -3px;
  }
  .headline p {
    font-size: 46px;
    font-weight: 500;
    color: #FF6B5A;
    margin-top: 28px;
    letter-spacing: -0.5px;
  }
  .phone-frame {
    margin-top: 60px;
    display: flex;
    justify-content: center;
  }
  .phone-bezel {
    width: 1000px;
    height: 2140px;
    background: #000000;
    border-radius: 80px;
    padding: 18px;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.6),
      0 0 0 2px rgba(255,255,255,0.08),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 64px;
    overflow: hidden;
    background: #1C1C1E;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
</style>
</head>
<body>
  <div class="headline">
    <h1>AI turns rambling<br>into clarity</h1>
    <p>One tap to enhance any note</p>
  </div>
  <div class="phone-frame">
    <div class="phone-bezel">
      <div class="phone-screen">
        <img src="03-note-detail.png" alt="EEON Note Detail">
      </div>
    </div>
  </div>
</body>
</html>
