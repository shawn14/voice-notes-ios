<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>EEON - Home Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1290px;
    height: 2796px;
    background: #1C1C1E;
    font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .headline {
    margin-top: 120px;
    text-align: center;
  }
  .headline h1 {
    font-size: 108px;
    font-weight: 800;
    color: #FFFFFF;
    line-height: 1.05;
    letter-spacing: -3px;
  }
  .headline p {
    font-size: 46px;
    font-weight: 500;
    color: #FF6B5A;
    margin-top: 28px;
    letter-spacing: -0.5px;
  }
  .phone-frame {
    margin-top: 60px;
    width: 1060px;
    height: 2200px;
    position: relative;
    display: flex;
    justify-content: center;
  }
  .phone-bezel {
    width: 1000px;
    height: 2140px;
    background: #000000;
    border-radius: 80px;
    padding: 18px;
    box-shadow:
      0 40px 100px rgba(0,0,0,0.6),
      0 0 0 2px rgba(255,255,255,0.08),
      inset 0 0 0 1px rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 64px;
    overflow: hidden;
    background: #1C1C1E;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
  }
  /* Dynamic Island */
  .dynamic-island {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 52px;
    background: #000;
    border-radius: 30px;
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="headline">
    <h1>Talk. Your AI<br>remembers.</h1>
    <p>Voice notes that think for you</p>
  </div>
  <div class="phone-frame">
    <div class="phone-bezel">
      <div class="phone-screen">
        <img src="sim-home.png" alt="EEON Home Screen">
      </div>
    </div>
  </div>
</body>
</html>
